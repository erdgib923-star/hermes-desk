<title>Hermes Paper Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#f7f6f2; --surface:#fdfdfb; --sunk:#f1efe9;
  --ink:#16150f; --ink-2:#514f46; --muted:#8a8779;
  --rule:#e3e0d6; --edge:#cbc7b9; --ring:rgba(22,21,15,.11);
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --bad:#d03b3b;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#100f0e; --surface:#1b1a18; --sunk:#232220;
    --ink:#f7f6f2; --ink-2:#c3c0b5; --muted:#8a8779;
    --rule:#2e2d2a; --edge:#3d3b37; --ring:rgba(247,246,242,.12);
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.14);
    --good:#0ca30c; --good-ink:#22b822; --warn:#fab219; --bad:#e05a5a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#100f0e; --surface:#1b1a18; --sunk:#232220;
  --ink:#f7f6f2; --ink-2:#c3c0b5; --muted:#8a8779;
  --rule:#2e2d2a; --edge:#3d3b37; --ring:rgba(247,246,242,.12);
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.14);
  --good:#0ca30c; --good-ink:#22b822; --warn:#fab219; --bad:#e05a5a;
}
*{box-sizing:border-box}
body{margin:0; background:var(--plane); color:var(--ink);
  font:15px/1.55 var(--sans); -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px; margin:0 auto; padding-block:26px 60px; padding-left:18px; padding-right:18px}
a{color:inherit}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* masthead — a ledger rule, not a hero */
.mast{display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 16px;
  padding-bottom:14px; border-bottom:2px solid var(--ink)}
.wordmark{font-family:var(--mono); font-weight:600; font-size:19px; letter-spacing:-.02em}
.wordmark em{font-style:normal; color:var(--accent)}
.stamp{font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.14em;
  padding:3px 8px; border:1px solid var(--good); color:var(--good-ink); border-radius:3px}
.gap{flex:1 1 40px}
.meta{font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.01em}
.tools{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
button,label.filebtn{font:500 12px var(--mono); letter-spacing:.03em; padding:6px 11px;
  border:1px solid var(--edge); background:var(--surface); color:var(--ink);
  border-radius:4px; cursor:pointer}
button:hover,label.filebtn:hover{border-color:var(--ink-2)}
button:focus-visible,label.filebtn:focus-within{outline:2px solid var(--accent); outline-offset:2px}
input[type=file]{position:absolute; width:1px; height:1px; opacity:0}

/* ledger head */
.ledger{display:flex; flex-wrap:wrap; gap:26px 44px; align-items:flex-end;
  padding:24px 0 22px; border-bottom:1px solid var(--rule)}
.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--muted)}
.figure{font-family:var(--mono); font-weight:600; font-size:clamp(34px,7vw,46px);
  letter-spacing:-.03em; line-height:1.02; margin-top:6px}
.delta{font-family:var(--mono); font-size:14px; font-weight:500; margin-top:7px}
.up{color:var(--good-ink)} .down{color:var(--bad)} .flat{color:var(--muted)}
.runinfo{min-width:280px; flex:1 1 280px; display:grid;
  grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:8px 22px}
.runinfo div{display:flex; justify-content:space-between; gap:10px;
  border-bottom:1px dotted var(--rule); padding-bottom:5px;
  font-family:var(--mono); font-size:11.5px}
.runinfo span:first-child{color:var(--muted); letter-spacing:.02em}

/* tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(138px,1fr));
  gap:1px; background:var(--rule); border:1px solid var(--rule); margin:22px 0;
  border-radius:5px; overflow:hidden}
.tile{background:var(--surface); padding:13px 15px 14px}
.tile .k{font-family:var(--mono); font-size:10px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted)}
.tile .v{font-family:var(--mono); font-weight:600; font-size:19px; margin-top:6px; letter-spacing:-.02em}
.tile .n{font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:3px}

/* sections */
section{margin:30px 0 0}
h2{font-size:14px; font-weight:600; margin:0 0 3px; letter-spacing:.01em;
  display:flex; align-items:baseline; gap:9px}
h2::after{content:""; flex:1; height:1px; background:var(--rule)}
.cap{font-size:12.5px; color:var(--muted); margin:0 0 16px; max-width:66ch}

/* charts */
.chartbox{position:relative; background:var(--surface); border:1px solid var(--rule);
  border-radius:5px; padding:14px 12px 8px}
svg{display:block; width:100%; height:auto}
.gridline{stroke:var(--rule); stroke-width:1}
.ref{stroke:var(--edge); stroke-width:1; stroke-dasharray:3 4}
.tk{fill:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:10px}
.eqline{fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.eqfill{fill:var(--accent); opacity:.09}
.cross{stroke:var(--edge); stroke-width:1; stroke-dasharray:3 3}
.knob{fill:var(--accent); stroke:var(--surface); stroke-width:2}
.tip{position:absolute; pointer-events:none; z-index:4; background:var(--surface);
  border:1px solid var(--edge); border-radius:4px; padding:7px 9px;
  font-family:var(--mono); font-size:11.5px; line-height:1.5; white-space:nowrap;
  box-shadow:0 5px 18px rgba(0,0,0,.16); opacity:0; transition:opacity .1s}
.tip .k{color:var(--muted)}

/* tables */
.tbl{overflow-x:auto; border:1px solid var(--rule); border-radius:5px; background:var(--surface)}
table{width:100%; border-collapse:collapse; font-size:12.5px}
th{text-align:left; font-family:var(--mono); font-weight:500; font-size:10px;
  letter-spacing:.11em; text-transform:uppercase; color:var(--muted);
  padding:10px 12px; white-space:nowrap; background:var(--sunk);
  border-bottom:1px solid var(--rule); position:sticky; top:0}
td{padding:11px 12px; border-bottom:1px solid var(--rule); vertical-align:top}
tr:last-child td{border-bottom:none}
.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.mkt{min-width:230px; max-width:330px}
.mkt a{text-decoration:none; border-bottom:1px solid var(--ring)}
.mkt a:hover{border-bottom-color:var(--accent)}
.why{font-size:11px; color:var(--muted); margin-top:4px; line-height:1.45;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.side{font-family:var(--mono); font-size:10.5px; font-weight:500; padding:2px 6px;
  border-radius:3px; border:1px solid var(--edge); white-space:nowrap; display:inline-block}
.side.y{color:var(--accent); border-color:color-mix(in srgb,var(--accent) 50%,transparent);
  background:var(--accent-soft)}
.side.b{color:var(--good-ink); border-color:color-mix(in srgb,var(--good) 50%,transparent)}
/* severity stripe: the row's own edge encodes whether it cleared the bar */
tr.qual td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.dim{opacity:.55}
.state{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; white-space:nowrap}
.led{width:7px; height:7px; border-radius:50%; flex:none}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.rulecol{background:var(--surface); border:1px solid var(--rule); border-radius:5px; padding:15px 16px}
.rh{font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.11em;
  padding:3px 8px; border-radius:3px; display:inline-block; margin-bottom:12px; border:1px solid var(--edge)}
.rh.buy{color:var(--good-ink); border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.rh.sell{color:var(--bad); border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
ol.rl{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
ol.rl li{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; line-height:1.5}
.sn{flex:none; width:17px; height:17px; border-radius:3px; background:var(--sunk);
  border:1px solid var(--rule); color:var(--ink-2); font-family:var(--mono); font-size:10px;
  display:grid; place-items:center; margin-top:2px}
.none{color:var(--muted); font-size:12.5px; padding:26px 16px; text-align:center}
.note{font-size:12px; color:var(--muted); line-height:1.7; margin-top:26px;
  border-top:1px solid var(--rule); padding-top:16px}
.note code{font-family:var(--mono); font-size:11.5px; background:var(--sunk);
  padding:1px 5px; border-radius:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

const money0=n=>{const v=Number(n||0); return (v<0?"-$":"$")+Math.abs(v).toLocaleString("en-US",{maximumFractionDigits:0});};

function equity(curve,start){
  if(!curve||curve.length<2)
    return '<div class="chartbox"><div class="none">The curve draws once the agent has completed two cycles.</div></div>';
  const W=820,H=236,P={t:16,r:18,b:28,l:62}, iw=W-P.l-P.r, ih=H-P.t-P.b;

  let g="";

    g+=`<line class="gridline" x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}"/>`
     + `<text class="tk" x="${P.l-10}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${money0(v)}</text>`;}
  const ys=Y(start);
  g+=`<line class="ref" x1="${P.l}" y1="${ys.toFixed(1)}" x2="${W-P.r}" y2="${ys.toFixed(1)}"/>`
   + `<text class="tk" x="${W-P.r}" y="${(ys-6).toFixed(1)}" text-anchor="end">start ${money0(start)}</text>`;
  const d=curve.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.equity).toFixed(1)}`).join(" ");
  const area=d+` L${X(curve.length-1).toFixed(1)},${(P.t+ih).toFixed(1)} L${P.l},${(P.t+ih).toFixed(1)} Z`;
  const last=curve[curve.length-1];
  g+=`<text class="tk" x="${P.l}" y="${H-8}">${esc(when(curve[0].ts))}</text>`
   + `<text class="tk" x="${W-P.r}" y="${H-8}" text-anchor="end">${esc(when(last.ts))}</text>`;
  window.__PTS__={pts:curve.map((p,i)=>({x:X(i),y:Y(p.equity),d:p})),W,H,P,iw,ih};

    tip.style.opacity=1;
    const sx=r.width/W, sy=r.height/H;
    tip.style.left=Math.min(Math.max(best.x*sx-tip.offsetWidth/2,4),r.width-tip.offsetWidth-4)+"px";
    tip.style.top=Math.max(4,best.y*sy-tip.offsetHeight-12)+"px";
  };
  svg.addEventListener("mousemove",show);
  svg.addEventListener("mouseleave",()=>{g.style.opacity=0;tip.style.opacity=0;});
}

/* ---- realised P&L per exit: diverging by sign, labelled in the tooltip ---- */
function pnl(trades){
  const sells=trades.filter(t=>t.action==="SELL").slice(0,26).reverse();
  if(!sells.length)
    return '<div class="chartbox"><div class="none">No closed trades yet — exits land here as positions resolve, hit the stop, or give up their edge.</div></div>';
  const W=820,H=196,P={t:16,r:18,b:16,l:62}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const mag=Math.max(...sells.map(t=>Math.abs(t.realized_pnl||0)),1);
  const Y=v=>P.t+ih/2-(v/mag)*(ih/2-8), z=Y(0), step=iw/sells.length;
  const bw=Math.max(6,Math.min(28,step-7)), X=i=>P.l+(i+.5)*step;
  let g=`<line class="gridline" x1="${P.l}" y1="${z}" x2="${W-P.r}" y2="${z}"/>`
       +`<text class="tk" x="${P.l-10}" y="${(z+3.5)}" text-anchor="end">$0</text>`;
  [mag,-mag].forEach(v=>{const y=Y(v);
    g+=`<line class="gridline" x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}"/>`
     + `<text class="tk" x="${P.l-10}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${money0(v)}</text>`;});
  const bars=sells.map((t,i)=>{const v=t.realized_pnl||0,y=Y(v),h=Math.max(2,Math.abs(z-y));
    return `<rect x="${(X(i)-bw/2).toFixed(1)}" y="${(v>=0?y:z).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${h.toFixed(1)}" rx="${Math.min(4,bw/2)}" fill="${v>=0?"var(--good)":"var(--bad)"}"
      class="bar" tabindex="0" data-q="${esc(String(t.question).slice(0,72))}" data-o="${esc(t.outcome)}"
      data-v="${v}" data-p="${t.realized_pct??""}" data-r="${esc(t.reason||"")}"/>`;}).join("");
  return `<div class="chartbox" id="pl"><svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Realised profit and loss for each closed paper trade">${g}${bars}</svg>
    <div class="tip" id="plt"></div></div>`;
}
function wirePnl(){
  const box=$("#pl"); if(!box)return; const tip=$("#plt");
  box.querySelectorAll(".bar").forEach(b=>{
    const on=()=>{const v=+b.dataset.v,p=b.dataset.p;
      tip.innerHTML=`<b class="${dir(v)}">${smoney(v)}</b>`
        +(p!==""?` <span class="k">${(+p>=0?"+":"")+(+p).toFixed(1)}%</span>`:"")
        +`<br>${esc(b.dataset.o)} · ${esc(b.dataset.q)}`
        +(b.dataset.r?`<br><span class="k">${esc(b.dataset.r)}</span>`:"");
      const r=box.getBoundingClientRect(),k=b.getBoundingClientRect();
      tip.style.opacity=1;
      tip.style.left=Math.min(Math.max(k.left-r.left+k.width/2-tip.offsetWidth/2,4),r.width-tip.offsetWidth-4)+"px";
      tip.style.top=Math.max(4,k.top-r.top-tip.offsetHeight-8)+"px";};
    b.addEventListener("mouseenter",on); b.addEventListener("focus",on);
    b.addEventListener("mouseleave",()=>tip.style.opacity=0);
    b.addEventListener("blur",()=>tip.style.opacity=0);
  });
}

const sideTag=o=>`<span class="side ${String(o).toLowerCase()==="yes"?"y":""}">${esc(o)}</span>`;

function positions(rows){

    <th class="n">Fair@entry</th><th class="n">Kelly</th></tr></thead><tbody>
    ${rows.map(p=>`<tr>
      <td class="mkt"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.question)}</a>
        ${p.hermes_reasoning?`<div class="why">${esc(p.hermes_reasoning)}</div>`:""}</td>

function rulesBlock(r){
  if(!r||!r.buy) return "";
  const li=a=>a.map((x,i)=>`<li><span class="sn">${i+1}</span><span>${esc(x)}</span></li>`).join("");
  return `<section><h2>When it buys, when it sells</h2>
    <p class="cap">Evaluated in this order every cycle; the first rule that matches decides. Read straight from the running agent's configuration, so they always match what is actually live.</p>
    <div class="cols">
      <div class="rulecol"><div class="rh buy">BUY — all must pass</div><ol class="rl">${li(r.buy)}</ol></div>
      <div class="rulecol"><div class="rh sell">SELL — any one triggers</div><ol class="rl">${li(r.sell)}</ol></div>
    </div></section>`;
}

function learnBlock(l){
  if(!l||!l.enabled) return `<section><h2>Learning</h2>
    <div class="tbl"><div class="none">Learning is switched off for this run.</div></div></section>`;
  const led = l.trustworthy
    ? `<span class="state"><span class="led" style="background:var(--good)"></span>adjustments active</span>`
    : `<span class="state"><span class="led" style="background:var(--warn)"></span>held near defaults</span>`;
  const rows=["momentum","hermes","blend"].map(n=>{
    const sc=(l.scores||{})[n]||{}, w=(l.model_weights||{})[n], sk=sc.skill;
    return `<tr><td style="text-transform:capitalize">${esc(n)}</td>
      <td class="n">${sc.n??0}</td>
      <td class="n">${sc.brier!=null?sc.brier.toFixed(4):"—"}</td>
      <td class="n">${sc.market_brier!=null?sc.market_brier.toFixed(4):"—"}</td>
      <td class="n ${sk==null?"":(sk>0?"up":(sk<0?"down":"flat"))}"><b>${sk!=null?(sk>0?"+":"")+sk.toFixed(4):"—"}</b></td>
      <td class="n">${w!=null?w.toFixed(2)+"×":(n==="blend"?"—":"1.00×")}</td></tr>`;}).join("");
  const cats=Object.entries(l.categories||{}).sort((a,b)=>(b[1].n||0)-(a[1].n||0));
  const catRows=cats.length?cats.map(([k,v])=>`<tr><td style="text-transform:capitalize">${esc(k)}</td>
      <td class="n">${v.n??0}</td>
      <td class="n ${v.skill==null?"":(v.skill>0?"up":"down")}">${v.skill!=null?(v.skill>0?"+":"")+v.skill.toFixed(4):"—"}</td>
      <td class="n">${(v.multiplier??1).toFixed(2)}×</td></tr>`).join("")
    :`<tr><td colspan="4" style="color:var(--muted)">No category has enough resolved outcomes yet.</td></tr>`;
  return `<section><h2>Learning</h2>
    <p class="cap">A fair-value forecast is logged for <b>every market priced</b>, not only the ones traded, then scored when that market resolves. Untraded forecasts are free ground truth and accumulate far faster than closed positions do.</p>
    <div class="runinfo" style="margin-bottom:18px">
      <div><span>scored</span><span>${l.scored||0}</span></div>
      <div><span>pending</span><span>${l.pending||0}</span></div>
      <div><span>markets</span><span>${l.scored_markets||0}</span></div>
      <div><span>edge capture</span><span>${(l.edge_capture??1).toFixed(2)}&times;${l.edge_capture_raw!=null?` <span style="color:var(--muted)">(measured ${l.edge_capture_raw.toFixed(2)})</span>`:""}</span></div>
      <div><span>status</span><span>${led}</span></div>
    </div>
    <div class="tbl"><table><thead><tr><th>Model</th><th class="n">Scored</th><th class="n">Brier</th>
      <th class="n">Market Brier</th><th class="n">Skill vs market</th><th class="n">Weight</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="cap" style="margin:14px 0 8px">Skill is the market's Brier score minus the model's, so <b>positive means the model beat the market price</b> — the only benchmark worth measuring against, since a model that cannot beat the price is adding no information however good its raw score looks.</p>
    <div class="tbl"><table><thead><tr><th>Category</th><th class="n">Scored</th>
      <th class="n">Skill</th><th class="n">Confidence</th></tr></thead><tbody>${catRows}</tbody></table></div>
    <p class="cap" style="margin-top:14px">A market forecast many times counts <b>once</b>, and an outcome's weight halves every ${l.halflife_days??45} days, so the agent tracks how markets behave now. Edge capture is the slope of realised edge on predicted edge: 1.0 means the predicted edges were real, 0 means they were noise, below 0 means they pointed the wrong way. Each learned value is shrunk toward its default by n/(n+${l.shrink_k??40}). Below roughly a hundred scored outcomes the agent behaves like the unlearned version on purpose: fitting these parameters to a dozen results would be curve-fitting noise, not learning.</p>
  </section>`;
}


function graderBlock(l){
  const g=(l&&l.grader)||null;
  if(!g||!g.board||!Object.keys(g.board).length) return "";
  const d=g.descriptions||{}, bar=g.bar||{};
  const names=Object.keys(d).length?Object.keys(d):Object.keys(g.board);
  const rows=names.map(n=>{
    const b=g.board[n]||{}, act=n===g.active;
    const gr=b.growth, pb=b.prob_better;
    return `<tr${act?' style="font-weight:600"':""}>
      <td>${esc(n)}${act?' <span style="color:var(--muted)">(running)</span>':""}<div class="why">${esc(d[n]||"")}</div></td>
      <td class="n">${b.trades??0}</td>
      <td class="n">${b.trades?(b.wins+"/"+b.trades):"—"}</td>
      <td class="n ${gr==null?"":(gr>0?"up":(gr<0?"down":"flat"))}">${gr!=null?(gr>0?"+":"")+gr.toFixed(3):"—"}</td>
      <td class="n">${act?"—":(b.gain_per_market!=null?(b.gain_per_market>0?"+":"")+b.gain_per_market.toFixed(4):"—")}</td>
      <td class="n">${act?"—":(pb!=null?(pb*100).toFixed(1)+"%":"—")}</td></tr>`;}).join("");
  const hist=(g.history||[]).slice().reverse().map(h=>`<li>${esc(when(h.at))}: <b>${esc(h.from)} &rarr; ${esc(h.to)}</b> &mdash; ${esc(h.reason)}</li>`).join("");
  return `<section><h2>How edge and confidence are graded</h2>
    <p class="cap">Several ways of turning the models into one fair value and one confidence are replayed over <b>every resolved market</b>, as the entry rules and quarter-Kelly sizing would have traded them. Score is bankroll log-growth &mdash; what Kelly maximises. The agent only abandons the grader it is running when a challenger beats it over at least ${bar.min_markets??60} markets and ${bar.min_trades??15} trades, by at least ${(bar.min_gain??0.003).toFixed(3)} log-growth per market, in at least ${((bar.min_prob??0.975)*100).toFixed(1)}% of bootstrap resamples, and not within ${bar.cooldown_days??7} days of the last switch. ${g.pinned?`<b>Pinned to &lsquo;${esc(g.pinned)}&rsquo; by HERMES_GRADER</b> &mdash; switching is off.`:"Set <code>HERMES_GRADER</code> to pin one yourself."}</p>
    <div class="tbl"><table><thead><tr><th>Grader</th><th class="n">Trades</th><th class="n">Won</th>
      <th class="n">Log-growth</th><th class="n">Gain / market</th><th class="n">P(better)</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="cap" style="margin-top:12px"><b>Decision:</b> ${esc(g.decision||"not evaluated yet")}</p>
    ${hist?`<ul class="cap">${hist}</ul>`:""}
  </section>`;
}

function playbookBlock(l){
  const pb=(l&&l.playbook)||{}, ks=Object.keys(pb);
  if(!ks.length) return "";
  const order={bad:0,good:1,unproven:2};
  const rows=ks.sort((a,b)=>(order[pb[a].verdict]-order[pb[b].verdict])||(pb[b].n-pb[a].n)).map(k=>{
    const v=pb[k], [dim,val]=k.split(/:(.*)/s);
    const cls=v.verdict==="bad"?"down":(v.verdict==="good"?"up":"");
    return `<tr><td style="text-transform:capitalize;color:var(--muted)">${esc(dim)}</td><td>${esc(val)}</td>
      <td class="n">${v.n}</td><td class="n">${v.wins}/${v.n}</td>
      <td class="n ${v.roi>0?"up":(v.roi<0?"down":"")}">${(v.roi>0?"+":"")+(v.roi*100).toFixed(0)}%</td>
      <td class="n">${v.t.toFixed(2)}</td>
      <td class="${cls}"><b>${esc(v.verdict)}</b>${v.multiplier<1?` &middot; conf &times;${v.multiplier.toFixed(2)}`:""}</td></tr>`;}).join("");
  return `<section><h2>Playbook &mdash; what works, what doesn&rsquo;t</h2>
    <p class="cap">Every resolved market replayed through the entry rules, grouped by the kind of trade it would have been. A kind needs ${l.playbook_min??12} resolved trades and a clear t-statistic before it is judged. <b>Bad</b> kinds get their confidence cut, which shrinks the Kelly stake and can drop them below the confidence floor. <b>Good</b> kinds are bought first when cash or position slots run short &mdash; a good record buys priority, never a bigger stake.</p>
    <div class="tbl"><table><thead><tr><th>Dimension</th><th>Kind</th><th class="n">Trades</th><th class="n">Won</th>
      <th class="n">Return</th><th class="n">t</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
}

function exitLearnBlock(l){
  const rules=(l&&l.exit_rules)||{}, ks=Object.keys(rules);
  const names={thesis:"Thesis broken",target:"Target reached",trailing:"Trailing stop",
               stop:"Hard stop",time:"Time stop",other:"Other"};
  const defs=(l&&l.exit_defaults)||{}, got=(l&&l.exit_params)||{};
  const pmap={thesis:"thesis_margin",stop:"stop_loss",target:"exit_edge",trailing:"trail_giveback"};
  const body = ks.length ? ks.sort().map(k=>{
    const r=rules[k], reg=r.avg_regret;
    const cls = reg>0.02?"down":(reg<-0.02?"up":"flat");
    const verdict = reg>0.02 ? "sold too early" : (reg<-0.02 ? "exit was right" : "about right");
    const pk=pmap[k], moved = pk&&got[pk]!=null&&defs[pk]!=null&&Math.abs(got[pk]-defs[pk])>1e-6;
    return `<tr>
      <td>${esc(names[k]||k)}</td>
      <td class="n">${r.n}</td>
      <td class="num ${cls}"><b>${reg>=0?"+":""}${reg.toFixed(3)}</b></td>
      <td class="num ${r.regret_usd>0?"down":"up"}">${smoney(r.regret_usd)}</td>
      <td class="n">${r.too_early}/${r.n}</td>
      <td>${esc(verdict)}</td>
      <td class="n">${pk?(moved
          ? `<b>${defs[pk].toFixed(3)} → ${got[pk].toFixed(3)}</b>`
          : `${(defs[pk]??0).toFixed(3)} <span style="color:var(--muted)">held</span>`):"—"}</td>
    </tr>`;}).join("")
   : `<tr><td colspan="7" style="color:var(--muted)">No exit has reached resolution yet. Each one is scored when its market settles.</td></tr>`;

  return `<section>
    <h2>Learning from its own exits</h2>
    <p class="cap">Every exit is recorded with the price it got. When that market finally settles, the agent compares what it banked against what simply <b>holding to settlement</b> would have paid. That difference is regret, per share: <b>positive means selling was a mistake</b>. Grouped by the rule that fired, so a rule that consistently sells too cheap can have its threshold widened — and one that is doing its job is left alone.</p>
    <div class="runinfo" style="margin-bottom:16px">
      <div><span>Exits scored</span><span>${(l&&l.exits_scored)||0}</span></div>
      <div><span>Awaiting settlement</span><span>${(l&&l.exits_pending)||0}</span></div>
      <div><span>Threshold moves need</span><span>${(l&&l.min_scored_for_exits)||10} per rule</span></div>
    </div>
    <div class="tbl"><table><thead><tr>
      <th>Exit rule</th><th class="n">Scored</th><th class="n">Regret/share</th>
      <th class="n">Regret $</th><th class="n">Too early</th><th>Verdict</th><th class="n">Threshold</th>
    </tr></thead><tbody>${body}</tbody></table></div>
    <p class="cap" style="margin-top:14px">A rule&rsquo;s threshold only moves once ${(l&&l.min_scored_for_exits)||10} of its exits have settled, and the move is shrunk by n/(n+${(l&&l.shrink_k)||40}) and hard-bounded. The hard stop may widen only so far — a risk limit that learning can dissolve is not a risk limit.</p>
  </section>`;
}


function researchCard(s){
  const rows=(s.signals||[]).filter(g=>g.research_fair!=null);
  const c=s.cycle||{};
  const seen=new Set(), uniq=[];
  for(const g of rows){ if(seen.has(g.market_id)) continue; seen.add(g.market_id); uniq.push(g); }
  const body = uniq.length ? uniq.slice(0,14).map(g=>{
    const cred=g.research_cred||0;
    const led = cred>=0.7?"var(--good)":(cred>=0.45?"var(--warn)":"var(--muted)");
    const delta = g.research_fair - g.ask;
    return `<tr>
      <td class="mkt"><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.question)}</a>
        <div class="why">${esc(g.research_explain||"")}</div>
        ${(g.research_flags||[]).length?`<div class="why" style="opacity:.85">&#9888; ${esc((g.research_flags||[]).join("; "))}</div>`:""}</td>
      <td><span class="side">${esc(g.research_kind||"?")}</span></td>
      <td class="n">${c3(g.ask)}</td>
      <td class="n"><b>${c3(g.research_fair)}</b></td>
      <td class="n ${delta>0?"up":(delta<0?"down":"flat")}">${(delta>=0?"+":"")+delta.toFixed(3)}</td>
      <td class="n"><span class="state"><span class="led" style="background:${led}"></span>${cred.toFixed(2)}</span></td>
    </tr>`;}).join("")
   : `<tr><td colspan="6" style="color:var(--muted)">No market in this scan had verifiable real-world data behind it.</td></tr>`;

  return `<section><h2>Research — real-world evidence</h2>
    <p class="cap">A third estimator, independent of the price path and of the language model. It derives probabilities from <b>hard data</b>: exchange spot and realised volatility for crypto thresholds, de-vigged consensus across bookmakers for fixtures. Every figure is checked before use — independent sources must agree, data must be fresh, the model must be inside its valid range, and the question must have been matched to the right real-world event. Evidence that fails is <b>discarded, not down-weighted</b>.</p>
    <div class="runinfo" style="margin-bottom:16px">
      <div><span>priced from data</span><span>${c.research_priced??0}</span></div>
      <div><span>declined</span><span>${c.research_declined??0}</span></div>
      <div><span>min credibility</span><span>${(s.config||{}).research_min_credibility??"—"}</span></div>
      <div><span>weight</span><span>${(s.config||{}).research_weight??"—"}&times;</span></div>
    </div>
    <div class="tbl"><table><thead><tr>
      <th class="mkt">Market &amp; evidence</th><th>Source</th><th class="n">Ask</th>
      <th class="n">Research</th><th class="n">Gap</th><th class="n">Credibility</th>
    </tr></thead><tbody>${body}</tbody></table></div>
    <p class="cap" style="margin-top:14px">A gap near zero is a <em>good</em> result, not a failure: it means Polymarket and the outside data agree, and there is nothing to trade. The value of this source is as much in the edges it refuses to confirm as in the ones it finds.</p>
  </section>`;
}


function llmCard(l){
  const models=(l&&l.llm_models)||{}, order=(l&&l.llm_order)||[];
  const rows = order.length ? order.map(name=>{
    const m=models[name]||{}, sk=m.skill;
    const short=name.split("/").pop();
    const state = m.scored
      ? (sk>0 ? "beating the market" : "worse than the market")
      : (m.n ? `${m.n}/${l.llm_min_scored||15} scored` : "not yet measured");
    const led = m.scored ? (sk>0?"var(--good)":"var(--bad)") : "var(--edge)";
    return `<tr>
      <td>${esc(short)}${name.includes(":free")?` <span class="side">free</span>`:` <span class="side b">paid</span>`}</td>
      <td class="n">${m.n||0}</td>
      <td class="n">${m.brier!=null?m.brier.toFixed(4):"—"}</td>
      <td class="n">${m.market_brier!=null?m.market_brier.toFixed(4):"—"}</td>
      <td class="n ${sk==null?"":(sk>0?"up":"down")}"><b>${sk!=null?(sk>0?"+":"")+sk.toFixed(4):"—"}</b></td>
      <td><span class="state"><span class="led" style="background:${led}"></span>${esc(state)}</span></td>
    </tr>`;}).join("")
   : `<tr><td colspan="6" style="color:var(--muted)">No model pool recorded yet.</td></tr>`;
  return `<section><h2>LLM pool — which AI is answering</h2>
    <p class="cap">The language-model estimator rotates through a pool. If one is out of credits, rate limited, or returns something unparseable, the next is tried — so the estimator keeps working even when the paid model cannot. Each model is <b>scored separately</b> by Brier against the market price, exactly as the other estimators are, and the pool is reordered so proven models are tried first. Order below is the live trying order.</p>
    <div class="tbl"><table><thead><tr>
      <th>Model</th><th class="n">Scored</th><th class="n">Brier</th>
      <th class="n">Market</th><th class="n">Skill</th><th>Status</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <p class="cap" style="margin-top:14px">A model has to be tried to be scored, so unmeasured ones keep their place rather than being exiled for being new. Measurably poor ones sink to the bottom but are not dropped — a thin sample can simply be unlucky.</p>
  </section>`;
}

function render(s){
  const st=s.stats||{}, c=s.cycle||{}, cfg=s.config||{}, p=st.total_pnl||0;
  const edge=cfg.edge_threshold??0.10;
  $("#meta").textContent=`cycle ${c.cycle??"—"} · snapshot ${since(s.generated_at)} · `
    +`${c.markets_scanned??0} markets scanned, ${c.markets_screened??0} screened, ${c.markets_priced??0} priced`;

  const hOn=c.hermes_online;
  // Runs are meant to land every 30 minutes. GitHub's scheduler drops
  // runs under load, so say so plainly when the page is behind rather
  // than leaving an old snapshot looking current.
  const ageMin=s.generated_at?(Date.now()-new Date(s.generated_at).getTime())/60000:0;
  const stale=ageMin>50?`<div class="tbl" style="margin-bottom:18px"><div class="none" style="color:var(--warn)">Last cycle ran ${esc(since(s.generated_at))}. Cycles are scheduled every 30 minutes; a gap this long means the scheduler skipped runs, not that the agent stopped.</div></div>`:"";
  $("#app").innerHTML=stale+`
  <div class="ledger">
    <div>
      <div class="eyebrow">Paper account equity</div>
      <div class="figure">${money(st.equity)}</div>
      <div class="delta ${dir(p)}">${smoney(p)} · ${pc(st.total_return_pct)} on ${money0(st.starting_bankroll)}</div>
    </div>
    <div class="runinfo">
      <div><span>fair value</span><span class="state"><span class="led" style="background:${hOn?"var(--good)":"var(--warn)"}"></span>${esc(hOn?"Hermes + momentum":"momentum only")}</span></div>
      <div><span>model</span><span>${esc(hOn?(cfg.hermes_model||"—"):"—")}</span></div>
      <div><span>llm calls</span><span>${c.hermes_calls??0} fresh${c.hermes_covered!=null?` · ${c.hermes_covered} covered`:""}</span></div>
      <div><span>grader</span><span>${esc(cfg.grader||"blend")}</span></div>
      <div><span>edge bar</span><span>${(edge*100).toFixed(0)}&cent;</span></div>
      <div><span>kelly</span><span>${cfg.kelly_fraction}&times;</span></div>
      <div><span>qualifying</span><span>${s.qualified_count??0}</span></div>
      <div><span>cycle time</span><span>${c.elapsed_s??"—"}s</span></div>
      <div><span>positions</span><span>${st.open_positions??0} / ${cfg.max_positions??"—"}</span></div>
    </div>
  </div>

  <div class="tiles">
    <div class="tile"><div class="k">Realised</div><div class="v ${dir(st.realized_pnl)}">${smoney(st.realized_pnl)}</div><div class="n">${st.closed_trades||0} closed</div></div>
    <div class="tile"><div class="k">Unrealised</div><div class="v ${dir(st.unrealized_pnl)}">${smoney(st.unrealized_pnl)}</div><div class="n">${st.open_positions||0} open</div></div>
    <div class="tile"><div class="k">Win rate</div><div class="v">${st.win_rate!=null?st.win_rate+"%":"—"}</div><div class="n">${st.wins||0}W · ${st.losses||0}L</div></div>
    <div class="tile"><div class="k">Profit factor</div><div class="v">${st.profit_factor!=null?st.profit_factor:"—"}</div><div class="n">${money(st.avg_win)} / ${money(st.avg_loss)}</div></div>
    <div class="tile"><div class="k">Max drawdown</div><div class="v">${st.max_drawdown_pct!=null?st.max_drawdown_pct+"%":"—"}</div><div class="n">peak to trough</div></div>
    <div class="tile"><div class="k">Exposure</div><div class="v">${st.exposure_pct??0}%</div><div class="n">${money(st.deployed)} at risk</div></div>
    <div class="tile"><div class="k">Cash</div><div class="v">${money(st.cash)}</div><div class="n">uncommitted</div></div>
  </div>

  <section><h2>Equity curve</h2>
    <p class="cap">Open positions are marked at the best <em>bid</em> — what the book would actually pay to take them off us — so the curve dips by the spread the moment a position opens.</p>
    ${equity(s.equity_curve,st.starting_bankroll)}</section>

  <section><h2>Open positions</h2>
    <p class="cap">“Fair@entry” is the blended fair value that justified the trade; “Kelly” is the bankroll fraction actually staked after the quarter-Kelly scaling and the caps.</p>
    ${positions(s.positions)}</section>

  <section><h2>Signals — last scan</h2>
    <p class="cap">Every outcome ranked by edge, meaning fair value minus the price we would pay. Rows marked with a blue edge cleared the ${(edge*100).toFixed(0)}&cent; bar; “Disposition” says what happened to each one and, when nothing did, why.</p>
    ${signals(s.signals,edge)}</section>

  <section><h2>Realised P&amp;L by exit</h2>
    <p class="cap">Each closed trade, oldest on the left. Above the zero line is a win, below it a loss; hover for the market and the exit reason.</p>
    ${pnl(s.trades||[])}</section>

  <section><h2>Fill log</h2>
    <p class="cap">Fills are simulated by walking the real order book level by level. “Slip” is the gap between the best posted price and the average price paid after eating depth.</p>
    ${fills(s.trades)}</section>

  ${llmCard(s.learning)}

  ${researchCard(s)}

  ${rulesBlock(s.rules)}

  ${learnBlock(s.learning)}

  ${exitLearnBlock(s.learning)}

  ${graderBlock(s.learning)}

  ${playbookBlock(s.learning)}

  <section><h2>Run configuration</h2>
    <p class="cap">Every value is an environment-variable override on the local agent.</p>
    <div class="tbl"><table><tbody>
      ${[["Edge threshold",cfg.edge_threshold],["Exit edge",cfg.exit_edge],
         ["Stop loss",cfg.stop_loss!=null?(cfg.stop_loss*100).toFixed(0)+"%":"—"],
         ["Kelly fraction",cfg.kelly_fraction],
         ["Max per position",cfg.max_position_pct!=null?(cfg.max_position_pct*100).toFixed(0)+"%":"—"],
         ["Max exposure",cfg.max_exposure_pct!=null?(cfg.max_exposure_pct*100).toFixed(0)+"%":"—"],
         ["Max positions",cfg.max_positions],["Min liquidity",money0(cfg.min_liquidity)],
         ["Min 24h volume",money0(cfg.min_volume_24h)],
         ["Price band",cfg.price_band?cfg.price_band.join(" – "):"—"],
         ["Max spread",cfg.max_spread],["Momentum half-life",cfg.momentum_halflife+" h"],
         ["Disagreement scale",cfg.disagreement_scale??"—"],["Cycle",cfg.cycle_seconds+"s"]]
        .map(([k,v])=>`<tr><td style="color:var(--muted)">${esc(k)}</td><td class="n">${esc(v??"—")}</td></tr>`).join("")}
    </tbody></table></div></section>`;

  wireEquity(st.starting_bankroll); wirePnl();

  const rj=s.screen_rejects||{};
  const parts=Object.entries(rj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${v} ${k}`);
  $("#note").innerHTML=`Screened out on this scan: ${parts.length?esc(parts.join(" · ")):"nothing"}.<br>`
    +`This page shows a snapshot exported from a local run. The agent writes <code>state/snapshot.json</code> `
    +`every cycle — use <b>LOAD snapshot.json</b> above to view your own, or run <code>python run.py</code> `
    +`for the live dashboard at <code>127.0.0.1:8787</code>.<br>`
    +`<b>Paper trading only.</b> No wallet is connected and no order is ever signed or submitted.`;
}

$("#pick").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ render(JSON.parse(r.result)); window.scrollTo({top:0}); }
    catch(err){ $("#meta").textContent="That file isn't a valid snapshot.json — "+err.message; } };
  r.readAsText(f);
});
$("#theme").addEventListener("click",()=>{
  const el=document.documentElement;
  const isDark = el.getAttribute("data-theme")==="dark"
    || (!el.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  el.setAttribute("data-theme", isDark?"light":"dark");
});

if(SNAPSHOT) render(SNAPSHOT);
else { $("#app").innerHTML=`<div class="tbl"><div class="none">No snapshot embedded. Use <b>LOAD snapshot.json</b> above.</div></div>`; }

/* On the hosted page the file itself is replaced by each scheduled run, so
   the only way to see a new cycle is to re-fetch the page. Reload on a timer
   there, and nowhere else - a loaded local snapshot must not be thrown away.
   Cycles land every 30 minutes; checking every 5 means a new one shows up
   within minutes of being published. */
if(location.hostname.endsWith("github.io")){
  setTimeout(()=>location.reload(), 5*60*1000);
}
</script>
